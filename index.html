<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04110b">
<title>DRAKARION POKAL 3 — Local</title>
<style>
:root{
  --bg:#020604;--panel:#07150e;--panel2:#0b2116;--line:#315640;
  --jade:#22ef9e;--jade2:#0a9a62;--gold:#e4bd60;--gold2:#8d6527;
  --text:#f5f8f5;--muted:#91a99b;--green:#22b960;--blue:#327ed0;--orange:#dc8330;--red:#c94545;
  --shadow:0 18px 50px #0009;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
body{
  background:
    radial-gradient(circle at 50% -10%,#0d53384d,transparent 34%),
    linear-gradient(180deg,#020604,#030906 55%,#010302);
}
button,input,select{font:inherit}
button{cursor:pointer}
#app{min-height:100vh}
.top{
  position:sticky;top:0;z-index:40;background:#020604ee;backdrop-filter:blur(12px);
  border-bottom:1px solid #8d652743;
}
.topin{max-width:1180px;margin:auto;display:flex;align-items:center;gap:10px;padding:9px 12px}
.brandmark{
  width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  border:2px solid var(--gold);color:var(--jade);font-weight:900;
  background:#03110b;box-shadow:0 0 24px #22ef9e35;
}
.brand{min-width:0;flex:1}
.brand b{display:block;font-family:Georgia,serif;color:var(--gold);font-size:17px;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:11px}
.localbadge{border:1px solid #24513b;background:#0a2117;color:#8ff1c4;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;white-space:nowrap}
.wrap{max-width:1180px;margin:auto;padding:12px 10px 92px}
